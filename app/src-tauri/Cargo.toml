[package]
name = "keyvo-app"
description = "keyvo desktop app: the Tauri 2 shell around the Svelte frontend"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/qubernetic/keyvo"
authors = ["Qubernetic"]
publish = false

# Outside the root workspace (pre-alpha decision 2): webkit2gtk is only in
# the dev image, so only `just app-build` and the CI `app` job compile this
# crate. Everything worth testing lives in keyvo-client.
[workspace]

[[bin]]
name = "keyvo-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
base64 = "0.22"
keyvo-client = { path = "../../crates/keyvo-client" }
keyvo-core = { path = "../../crates/keyvo-core" }
rustix = { version = "1", default-features = false, features = ["std", "process"] }
serde_json = "1"
tauri = { version = "2.12.5", features = [] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true

# Dev container for keyvo (ADR-0002). Driven by the justfile; see `just --list`.
# KEYVO_UID / KEYVO_GID are passed by the justfile from `id -u` / `id -g`.
services:
  rust:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${KEYVO_UID:-1000}
        GID: ${KEYVO_GID:-1000}
    init: true
    working_dir: /workspace
    volumes:
      # target/ stays on the bind mount so the host can run the built binaries.
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
    environment:
      CARGO_TERM_COLOR: always
    command: ["sleep", "infinity"]

volumes:
  cargo-registry:
  cargo-git:

# The terminal profile the key editor fixtures edit (README.md here).
schema_version = 1

[profile]
id     = "terminal"
name   = "Shell work"
accent = "#e67e22"
global_pages = false

[profile.match]
class = ["org.kde.konsole"]   # Konsole only

[[pages]]
name = "context"

[pages.keys.1]                # a new shell
icon   = "lucide:terminal"
label  = "Shell"
action = { type = "exec", cmd = "konsole" }

[pages.keys.2]                # the key the steps edit
label  = "Copy"
action = { type = "chord", keys = "ctrl+shift+c" }

# Keys 3 to 9 are blank.

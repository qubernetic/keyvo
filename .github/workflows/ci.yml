# Linux CI (ADR-0002 parity): build the dev image from the repository
# Dockerfile and run the `just ci` sequence inside it, with the same command
# lines as the justfile recipes. Tool versions live in the Dockerfile and
# rust-toolchain.toml only.
name: CI

on:
  pull_request:
    branches: [develop, main, "epic/**"]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    # This job builds and runs pull request code, so it gets no OIDC token;
    # the uploads run in the separate `codecov` job below.
    permissions:
      contents: read
    env:
      IMAGE: keyvo-dev:ci
      CONTAINER: keyvo-ci
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read runner UID and GID
        id: ids
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the dev image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            UID=${{ steps.ids.outputs.uid }}
            GID=${{ steps.ids.outputs.gid }}
          # Pull request runs only read the cache; pushes to develop and main
          # write it, so pull request code cannot seed a cache for them.
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}

      # Same split as the image cache: restore only on pull requests, restore
      # and save on push.
      - name: Restore the cargo registry
        if: ${{ github.event_name != 'push' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo-ci/registry
            ~/.cargo-ci/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Cache the cargo registry
        if: ${{ github.event_name == 'push' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo-ci/registry
            ~/.cargo-ci/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      # Same mounts as the `rust` compose service; target/ stays on the
      # bind mount and is not cached.
      - name: Start the dev container
        run: |
          mkdir -p "$HOME/.cargo-ci/registry" "$HOME/.cargo-ci/git"
          docker run --detach --init --name "$CONTAINER" \
            --env CARGO_TERM_COLOR=always \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$HOME/.cargo-ci/registry:/usr/local/cargo/registry" \
            --volume "$HOME/.cargo-ci/git:/usr/local/cargo/git" \
            "$IMAGE" sleep infinity

      - name: fmt-check
        run: docker exec "$CONTAINER" cargo fmt --all -- --check

      - name: lint
        run: docker exec "$CONTAINER" cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: docker exec "$CONTAINER" cargo nextest run --workspace --profile ci

      - name: deny
        run: docker exec "$CONTAINER" cargo deny check

      - name: cov
        run: |
          docker exec "$CONTAINER" mkdir -p coverage
          docker exec "$CONTAINER" cargo llvm-cov nextest --workspace --profile ci --lcov --output-path coverage/lcov.info
          docker exec "$CONTAINER" cargo llvm-cov report --summary-only

      - name: Upload the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            coverage/lcov.info
            target/nextest/ci/junit.xml
          retention-days: 3

      - name: Stop the dev container
        if: always()
        run: docker rm --force "$CONTAINER"

  # The only job with an OIDC token. It never builds or runs repository code:
  # it checks out the commit for the Codecov metadata, takes the reports from
  # the `ci` job and uploads them. Without an OIDC token (Dependabot, forks)
  # the upload fails but the job stays green (fail_ci_if_error false).
  codecov:
    name: codecov
    needs: ci
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reports

      # version pins the Codecov CLI to v11.3.1; cleanup downloads it into a
      # temporary directory and removes it after the step.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          version: v11.3.1
          cleanup: true
          files: coverage/lcov.info
          disable_search: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          version: v11.3.1
          cleanup: true
          report_type: test_results
          files: target/nextest/ci/junit.xml
          disable_search: true

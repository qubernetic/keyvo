# Linux CI (ADR-0002 parity): build the dev image from the repository
# Dockerfile and run the `just ci` sequence inside it, with the same command
# lines as the justfile recipes. Tool versions live in the Dockerfile and
# rust-toolchain.toml only.
name: CI

on:
  pull_request:
    branches: [develop, main, "epic/**"]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    # A cold run (image build without cache plus every check) took about 3.5
    # minutes on ubuntu-24.04; 20 minutes leaves room for a slow runner and a
    # growing workspace while still stopping a hung step early.
    timeout-minutes: 20
    # This job builds and runs pull request code, so it gets no OIDC token;
    # the uploads run in the separate `codecov` job below.
    permissions:
      contents: read
    env:
      IMAGE: keyvo-dev:ci
      CONTAINER: keyvo-ci
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read runner UID and GID
        id: ids
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the dev image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            UID=${{ steps.ids.outputs.uid }}
            GID=${{ steps.ids.outputs.gid }}
          # Pull request runs only read the cache; pushes to develop and main
          # write it, so pull request code cannot seed a cache for them.
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}

      # Same split as the image cache: restore only on pull requests, restore
      # and save on push.
      - name: Restore the cargo registry
        if: ${{ github.event_name != 'push' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo-ci/registry
            ~/.cargo-ci/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Cache the cargo registry
        if: ${{ github.event_name == 'push' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo-ci/registry
            ~/.cargo-ci/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      # Same mounts as the `rust` compose service; target/ stays on the
      # bind mount and is not cached.
      - name: Start the dev container
        run: |
          mkdir -p "$HOME/.cargo-ci/registry" "$HOME/.cargo-ci/git"
          docker run --detach --init --name "$CONTAINER" \
            --env CARGO_TERM_COLOR=always \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$HOME/.cargo-ci/registry:/usr/local/cargo/registry" \
            --volume "$HOME/.cargo-ci/git:/usr/local/cargo/git" \
            "$IMAGE" sleep infinity

      - name: fmt-check
        run: docker exec "$CONTAINER" cargo fmt --all -- --check

      - name: lint
        run: docker exec "$CONTAINER" cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: docker exec "$CONTAINER" cargo nextest run --workspace --profile ci

      - name: deny
        run: docker exec "$CONTAINER" cargo deny check

      - name: cov
        run: |
          docker exec "$CONTAINER" mkdir -p coverage
          docker exec "$CONTAINER" cargo llvm-cov nextest --workspace --profile ci --lcov --output-path coverage/lcov.info
          docker exec "$CONTAINER" cargo llvm-cov report --summary-only

      # upload-artifact follows symlinks, so code in the container could point
      # a report at a host file (for example /proc/self/environ). Every report
      # that exists must resolve to a regular file inside the workspace; a
      # directory is rejected too, because upload-artifact uploads it
      # recursively and follows the symlinks inside it. A report that was
      # never written (an earlier step failed) is skipped, as before.
      - name: Check the report paths
        id: report-paths
        if: ${{ !cancelled() }}
        run: |
          workspace="$(realpath -e "$GITHUB_WORKSPACE")"
          for report in coverage/lcov.info target/nextest/ci/junit.xml; do
            if [ ! -e "$report" ] && [ ! -L "$report" ]; then
              echo "$report: not written, skipped"
              continue
            fi
            resolved="$(realpath -e "$report")" || {
              echo "::error::$report does not resolve to an existing file"
              exit 1
            }
            [ -f "$resolved" ] || {
              echo "::error::$report is not a regular file: $resolved"
              exit 1
            }
            case "$resolved" in
              "$workspace"/*) echo "$report: $resolved" ;;
              *)
                echo "::error::$report resolves outside the workspace: $resolved"
                exit 1
                ;;
            esac
          done

      - name: Upload the reports
        if: ${{ !cancelled() && steps.report-paths.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            coverage/lcov.info
            target/nextest/ci/junit.xml
          retention-days: 3

      - name: Stop the dev container
        if: always()
        run: docker rm --force "$CONTAINER"

  # The desktop app (pre-alpha decision 2): the frontend checks of
  # `just app-test` and the Tauri shell build of `just app-build`, in the same
  # dev image, with the same command lines as the recipes. The shell is
  # outside the root workspace, so it has its own Cargo.lock and target/.
  app:
    name: app
    runs-on: ubuntu-24.04
    # The first run (image without cache, npm install, clippy and a debug
    # build of about 450 crates) took about 5 minutes on ubuntu-24.04; 30
    # minutes leaves room for a slow runner while still stopping a hung step.
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      IMAGE: keyvo-dev:ci
      CONTAINER: keyvo-app-ci
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read runner UID and GID
        id: ids
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the dev image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            UID=${{ steps.ids.outputs.uid }}
            GID=${{ steps.ids.outputs.gid }}
          # Same rule as the `ci` job: pull requests only read the cache.
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}

      - name: Restore the cargo registry
        if: ${{ github.event_name != 'push' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo-ci/registry
            ~/.cargo-ci/git
          key: cargo-registry-app-${{ runner.os }}-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: cargo-registry-app-${{ runner.os }}-

      - name: Cache the cargo registry
        if: ${{ github.event_name == 'push' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo-ci/registry
            ~/.cargo-ci/git
          key: cargo-registry-app-${{ runner.os }}-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: cargo-registry-app-${{ runner.os }}-

      - name: Start the dev container
        run: |
          mkdir -p "$HOME/.cargo-ci/registry" "$HOME/.cargo-ci/git"
          docker run --detach --init --name "$CONTAINER" \
            --env CARGO_TERM_COLOR=always \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$HOME/.cargo-ci/registry:/usr/local/cargo/registry" \
            --volume "$HOME/.cargo-ci/git:/usr/local/cargo/git" \
            "$IMAGE" sleep infinity

      - name: app-test
        run: |
          docker exec "$CONTAINER" npm --prefix app ci --no-fund --no-audit
          docker exec "$CONTAINER" npm --prefix app run check
          docker exec "$CONTAINER" npm --prefix app test

      # Both app lockfiles against advisories and licences, as `just app-test`
      # does: the root `deny` step never sees app/src-tauri/Cargo.lock, which
      # cargo-deny checks with app/src-tauri/deny.toml next to the manifest.
      - name: app-audit
        run: |
          docker exec "$CONTAINER" npm --prefix app audit --audit-level=high
          docker exec "$CONTAINER" cargo deny --manifest-path app/src-tauri/Cargo.toml check

      - name: app-build
        run: |
          docker exec "$CONTAINER" npm --prefix app run build
          docker exec "$CONTAINER" cargo fmt --manifest-path app/src-tauri/Cargo.toml -- --check
          docker exec "$CONTAINER" cargo clippy --manifest-path app/src-tauri/Cargo.toml --locked --all-targets -- -D warnings
          docker exec "$CONTAINER" cargo build --manifest-path app/src-tauri/Cargo.toml --locked --profile dev --features tauri/custom-protocol

      # `just flatpak-sources-check`: the Flatpak's offline sources match the
      # three lockfiles, so a lockfile change without `just flatpak-sources`
      # fails here.
      - name: flatpak-sources-check
        run: docker exec "$CONTAINER" python3 tools/flatpak/generate.py --check

      - name: Stop the dev container
        if: always()
        run: docker rm --force "$CONTAINER"

  # keyvo's Flatpak (contrib/flatpak/, roadmap M4b-1): the bundle built
  # offline from the manifest the way Flathub builds it, the manifest and
  # repository lints and the metainfo validation. `just flatpak` is the same
  # build on the owner's host. The bundle is the job's artifact.
  flatpak:
    name: flatpak
    runs-on: ubuntu-24.04
    # Downloading the GNOME 51 SDK and a release build of the app and the
    # CLI; 60 minutes leaves room for a cold cache and a slow runner.
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      # flatpak, flatpak-builder, flatpak-builder-lint and appstreamcli, with
      # the Flathub remote; the tag is the manifest's runtime, pinned by its
      # index digest.
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
      # flatpak-builder's bubblewrap sandbox needs it inside the container
      # (the documented setup of flatpak-github-actions).
      options: --privileged
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the manifest
        run: >-
          flatpak-builder-lint --exceptions
          --user-exceptions contrib/flatpak/lint-exceptions.json
          manifest contrib/flatpak/io.github.qubernetic.keyvo.yml

      # Everything the build writes stays under build/, which the manifest's
      # `dir` source skips. Pull requests only restore the flatpak-builder
      # cache, as the other jobs do; the bundle goes up in the step below.
      - name: Build the bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: contrib/flatpak/io.github.qubernetic.keyvo.yml
          bundle: keyvo.flatpak
          build-dir: build/flatpak
          repo-dir: build/repo
          state-dir: build/flatpak-builder
          cache-key: flatpak-${{ hashFiles('Cargo.lock', 'app/src-tauri/Cargo.lock', 'app/package-lock.json') }}
          save-cache: ${{ github.event_name == 'push' }}
          upload-artifact: false

      - name: Validate the metainfo
        run: appstreamcli validate --no-net --explain contrib/flatpak/io.github.qubernetic.keyvo.metainfo.xml

      - name: Lint the repository
        run: >-
          flatpak-builder-lint --exceptions
          --user-exceptions contrib/flatpak/lint-exceptions.json
          repo build/repo

      - name: Upload the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keyvo.flatpak
          path: keyvo.flatpak
          if-no-files-found: error
          retention-days: 14

  # The only job with an OIDC token. It never builds or runs repository code:
  # it checks out the commit for the Codecov metadata, takes the reports from
  # the `ci` job and uploads them. Without an OIDC token (Dependabot, forks)
  # the upload fails but the job stays green (fail_ci_if_error false).
  codecov:
    name: codecov
    needs: ci
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    # Two uploads took about 15 seconds; 10 minutes covers a slow Codecov API.
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reports

      # version pins the Codecov CLI to v11.3.1; cleanup downloads it into a
      # temporary directory and removes it after the step. plugins: noop stops
      # the CLI from running its default xcode, gcov and pycoverage plugins
      # over the pull request checkout.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          version: v11.3.1
          cleanup: true
          plugins: noop
          files: coverage/lcov.info
          disable_search: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          version: v11.3.1
          cleanup: true
          report_type: test_results
          files: target/nextest/ci/junit.xml
          disable_search: true

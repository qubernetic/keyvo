version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: "chore(deps)"

  # The desktop app's own lockfiles: the Tauri shell is outside the root
  # workspace (app/src-tauri/Cargo.lock) and the frontend has its own npm lock.
  - package-ecosystem: cargo
    directory: /app/src-tauri
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: "build"

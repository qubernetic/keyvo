[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/qubernetic/keyvo"
authors = ["Qubernetic"]
publish = false

[workspace.dependencies]
keyvo-core = { path = "crates/keyvo-core" }
keyvo-hid = { path = "crates/keyvo-hid" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true

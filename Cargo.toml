[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/qubernetic/keyvo"
authors = ["Qubernetic"]
publish = false

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
keyvo-client = { path = "crates/keyvo-client" }
keyvo-core = { path = "crates/keyvo-core" }
keyvo-hid = { path = "crates/keyvo-hid" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
insta = "1"
regex = "1"
resvg = { version = "0.49", default-features = false, features = ["text"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true

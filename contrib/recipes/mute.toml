# keyvo recipe pack: mute or unmute the sound.
# As volume-up.toml: Plasma's own shortcut first, the media key for GNOME
# and X11.
schema_version = 1

[recipe]
group = "system"
name  = "Mute"
icon  = "lucide:volume-x"
label = "Mute"

[[variants]]
id     = "plasma"
name   = "Plasma mute shortcut"
action = { type = "exec", cmd = "gdbus call --session --dest org.kde.kglobalaccel --object-path /component/kmix --method org.kde.kglobalaccel.Component.invokeShortcut mute" }

[[variants]]
id     = "key"
name   = "Mute media key"
action = { type = "chord", keys = "mute" }

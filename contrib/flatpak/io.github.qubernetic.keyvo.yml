# keyvo's Flatpak: the desktop app (`keyvo-app`) and the `keyvo` CLI on the
# GNOME runtime, built offline the way Flathub builds (spec §3, keyvo#182).
#
# The daemon is not in here; it runs on the host (`keyvo-daemon`, later its
# systemd user unit). The host daemon owns everything that touches the
# machine: `/dev/hidraw*` (the Keypad and the Bolt receiver), `/dev/uinput`
# (the key injector), the KWin script and its D-Bus focus interface
# `org.qubernetic.keyvo.Focus` on the session bus, and logind's session lock
# on the system bus. The app and the CLI only speak the socket API to it and
# edit the profile files it loads. Shipping the daemon inside the sandbox
# would add `--device=all`, `--talk-name=org.kde.KWin` and
# `--system-talk-name=org.freedesktop.login1` to the list below, which is
# why it stays on the host.
#
# Local build: `just flatpak` on the host. CI: the `flatpak` job of
# .github/workflows/ci.yml builds the bundle from this file. The Flathub
# submission (roadmap M4b-2) swaps the `dir` source for a `git` source and
# keeps the rest.
id: io.github.qubernetic.keyvo
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
# The extensions of the runtime's freedesktop branch (26.08). Their cargo
# has no rustup, so rust-toolchain.toml is ignored; the extension's stable
# compiler builds edition 2024.
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24
command: keyvo-app
finish-args:
  # Graphics: the WebKitGTK view on Wayland, X11 only as the fallback.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The host daemon's runtime directory: the control socket
  # `$XDG_RUNTIME_DIR/keyvo/keyvo.sock`. The daemon creates it with mode
  # 0700; the app and `keyvo ctl` connect to it.
  - --filesystem=xdg-run/keyvo
  # The configuration directory the daemon loads (`~/.config/keyvo`, the
  # `config_dir` of its `status` reply). The editor writes the profile files
  # in it, at the same path inside the sandbox. Snapshots stay in the app's
  # own state directory (~/.var/app/io.github.qubernetic.keyvo/.local/state);
  # "Open in editor" goes through the OpenURI portal (the runtime's
  # xdg-open), so no other directory and no D-Bus name is needed.
  - --filesystem=xdg-config/keyvo:create
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node24/bin
modules:
  - name: keyvo
    buildsystem: simple
    build-options:
      env:
        # The vendored crates of cargo-sources.json and npm's cache of
        # node-sources.json; nothing is fetched while building.
        CARGO_HOME: /run/build/keyvo/cargo
        CARGO_NET_OFFLINE: 'true'
        npm_config_cache: /run/build/keyvo/flatpak-node/npm-cache
        npm_config_offline: 'true'
        XDG_CACHE_HOME: /run/build/keyvo/flatpak-node/cache
    build-commands:
      - npm --prefix app ci --offline --no-fund --no-audit
      - npm --prefix app run build
      - cargo --offline build --release --locked --manifest-path app/src-tauri/Cargo.toml
        --features tauri/custom-protocol
      - cargo --offline build --release --locked -p keyvo-cli
      - install -Dm755 app/src-tauri/target/release/keyvo-app ${FLATPAK_DEST}/bin/keyvo-app
      - install -Dm755 target/release/keyvo ${FLATPAK_DEST}/bin/keyvo
      - install -Dm644 contrib/flatpak/${FLATPAK_ID}.desktop
        ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 contrib/flatpak/${FLATPAK_ID}.metainfo.xml
        ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      # The app icon (app/src-tauri/icons/icon.png, 256 px) and its 128 px
      # copy; the design assets have no scalable version yet.
      - install -Dm644 app/src-tauri/icons/icon.png
        ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      - install -Dm644 contrib/flatpak/icons/128x128/${FLATPAK_ID}.png
        ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
    sources:
      # The checkout this file is in; build outputs and caches stay out.
      - type: dir
        path: ../..
        skip:
          - .git
          - .flatpak-builder
          - build
          - keyvo.flatpak
          - bin
          - target
          - coverage
          - app/node_modules
          - app/dist
          - app/src-tauri/target
      # Generated by `just flatpak-sources` (tools/flatpak/) from Cargo.lock,
      # app/src-tauri/Cargo.lock and app/package-lock.json.
      - cargo-sources.json
      - node-sources.json
